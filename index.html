<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple LMS</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: Arial, sans-serif; background: #f5f6f8; color: #222; }

        body.no-scroll { overflow: hidden; }

        .header {
            height: 60px; background: #111827; color: white;
            display: flex; align-items: center;
            padding: 0 25px; font-size: 20px; font-weight: bold;
        }

        .lms-container { display: flex; height: calc(100vh - 60px); }

        /* SIDEBAR */
        .sidebar { width: 300px; background: white; border-right: 1px solid #ddd; overflow-y: auto; flex-shrink: 0; }
        .course-title { padding: 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #eee; }
        .lesson { padding: 16px 20px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
        .lesson:hover { background: #f3f4f6; }
        .lesson.active { background: #e8f0ff; border-left: 4px solid #2563eb; padding-left: 16px; }
        .lesson-title { font-size: 15px; font-weight: 500; line-height: 1.4; }
        .lesson-duration { font-size: 12px; color: #777; margin-top: 5px; }

        /* CONTENT */
        .content { flex: 1; padding: 30px; overflow-y: auto; min-width: 0; }
        .video-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; max-width: 1000px; }

        /* =========================================
           VIDEO WRAPPER

           container-type lets the blocking areas
           react to the PLAYER width (not the page
           width). YouTube switches between its
           desktop and mobile layout based on the
           player width, so this matches it exactly.
        ========================================= */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            container-type: inline-size;
            container-name: player;
        }

        .video-wrapper iframe {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            border: none; display: block;
        }

        /* =========================================
           BLOCKING AREAS (wide player = desktop layout)
        ========================================= */
        .youtube-block {
            position: absolute;
            z-index: 100;
            background: transparent;
            pointer-events: auto;
        }

        .youtube-top-info-block       { top: 0; left: 0;    width: 64%; height: 14%; }
        .youtube-top-info-block2      { top: 0; right: 13%; width: 20%; height: 14%; }
        .youtube-watch-block          { bottom: 0; right: 0;   width: 23%; height: 15%; }
        .youtube-more-videos-block    { bottom: 0; right: 23%; width: 20%; height: 15%; }
        .youtube-channel-block        { bottom: 0; left: 0;    width: 15%; height: 15%; }

        /* =========================================
           NARROW PLAYER = YouTube mobile layout
           (title top-left, share/watch-later
           bottom-left, channel logo bottom-right)
        ========================================= */
        @container player (max-width: 600px) {
            .youtube-top-info-block    { width: 62%; height: 16%; }
            .youtube-top-info-block2   { right: 12%; width: 23%; height: 16%; }
            .youtube-watch-block       { width: 17%; height: 20%; }
            .youtube-more-videos-block { right: 17%; width: 20%; height: 20%; }
            .youtube-channel-block     { width: 30%; height: 22%; }
        }

        @container player (max-width: 380px) {
            .youtube-top-info-block    { width: 62%; height: 19%; }
            .youtube-top-info-block2   { right: 10%; width: 26%; height: 19%; }
            .youtube-watch-block       { width: 20%; height: 24%; }
            .youtube-more-videos-block { right: 20%; width: 22%; height: 24%; }
            .youtube-channel-block     { width: 34%; height: 26%; }
        }

        /* =========================================
           CUSTOM FULLSCREEN BUTTON
        ========================================= */
        .custom-fullscreen {
            position: absolute;
            right: 12px; bottom: 12px;
            z-index: 200;
            width: 44px; height: 40px;
            border: none; border-radius: 6px;
            background: rgba(0, 0, 0, 0.65);
            color: white; font-size: 22px;
            cursor: pointer;
        }
        .custom-fullscreen:hover { background: rgba(0, 0, 0, 0.85); }

        /* =========================================
           FULLSCREEN
           - native fullscreen (desktop, Android)
           - .pseudo-fs fallback (iPhone Safari, which
             cannot fullscreen a div)
           Blocking areas stay inside the wrapper, so
           they keep working in both modes.
        ========================================= */
        .video-wrapper:fullscreen,
        .video-wrapper:-webkit-full-screen,
        .video-wrapper.pseudo-fs {
            width: 100vw; height: 100vh;
            max-width: none; border-radius: 0;
            aspect-ratio: auto;
        }

        .video-wrapper.pseudo-fs {
            position: fixed; inset: 0;
            width: 100%; height: 100dvh;
            z-index: 9999;
        }

        /* =========================================
           DEBUG: open the page with #debug at the end
           of the URL to see the blocking areas in red
        ========================================= */
        .video-wrapper.debug .youtube-block {
            background: rgba(255, 0, 0, 0.35);
            outline: 1px solid red;
        }

        /* DESCRIPTION */
        .description { max-width: 1000px; margin-top: 20px; background: white; padding: 20px; border-radius: 10px; }
        .description h3 { margin-bottom: 10px; }
        .description p { color: #666; line-height: 1.6; }

        @media (max-width: 1024px) {
            .sidebar { width: 260px; }
            .content { padding: 20px; }
            .video-title { font-size: 22px; }
        }

        @media (max-width: 768px) {
            .header { height: 55px; padding: 0 15px; font-size: 18px; }
            .lms-container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; height: auto; max-height: 280px; border-right: none; border-bottom: 1px solid #ddd; }
            .course-title { padding: 15px; font-size: 17px; }
            .lesson { padding: 14px 15px; }
            .lesson.active { padding-left: 11px; }
            .content { padding: 15px; overflow-y: visible; }
            .video-title { font-size: 19px; line-height: 1.35; margin-bottom: 15px; }
            .custom-fullscreen { right: 10px; bottom: 10px; width: 42px; height: 38px; font-size: 20px; }
            .description { margin-top: 15px; padding: 15px; }
        }

        @media (max-width: 480px) {
            .content { padding: 10px; }
            .video-title { font-size: 17px; }
        }
    </style>
</head>

<body>

    <header class="header">Simple LMS</header>

    <div class="lms-container">

        <aside class="sidebar">
            <div class="course-title">NCOD</div>

            <div
                class="lesson active"
                data-video="_01qa9OYsDw"
                data-title="28 Feb 2023 # 2PBTB, RBS, TBS, Range Markeing Detail, Demand Zone."
            >
                <div class="lesson-title">28 Feb 2023 # 2PBTB, RBS, TBS...</div>
                <div class="lesson-duration">Video</div>
            </div>
        </aside>

        <main class="content">

            <h1 class="video-title" id="videoTitle">
                28 Feb 2023 # 2PBTB, RBS, TBS, Range Markeing Detail, Demand Zone.
            </h1>

            <div class="video-wrapper" id="videoWrapper">

                <iframe
                    id="youtubePlayer"
                    src="https://www.youtube.com/embed/_01qa9OYsDw?rel=0&modestbranding=1&fs=0&playsinline=1"
                    title="Course Video"
                    allow="accelerometer; autoplay; encrypted-media; picture-in-picture"
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

                <!-- Blocking areas -->
                <div class="youtube-block youtube-top-info-block"></div>
                <div class="youtube-block youtube-top-info-block2"></div>
                <div class="youtube-block youtube-watch-block"></div>
                <div class="youtube-block youtube-more-videos-block"></div>
                <div class="youtube-block youtube-channel-block"></div>

                <!-- Custom fullscreen -->
                <button type="button" id="fullscreenButton" class="custom-fullscreen" aria-label="Fullscreen">&#9974;</button>

            </div>

            <div class="description">
                <h3>About this lesson</h3>
                <p id="descriptionText">No description available for this lesson.</p>
            </div>

        </main>

    </div>

    <script>
        const lessons = document.querySelectorAll(".lesson");
        const youtubePlayer = document.getElementById("youtubePlayer");
        const videoTitle = document.getElementById("videoTitle");
        const descriptionText = document.getElementById("descriptionText");
        const videoWrapper = document.getElementById("videoWrapper");
        const fullscreenButton = document.getElementById("fullscreenButton");

        /* Debug view: add #debug to the URL */
        if (location.hash === "#debug") videoWrapper.classList.add("debug");

        function getYoutubeUrl(videoId) {
            return "https://www.youtube.com/embed/" + videoId + "?rel=0&modestbranding=1&fs=0&playsinline=1";
        }

        /* Lesson switching */
        lessons.forEach(function (lesson) {
            lesson.addEventListener("click", function () {
                lessons.forEach(function (item) { item.classList.remove("active"); });
                lesson.classList.add("active");

                const title = lesson.getAttribute("data-title");
                youtubePlayer.src = getYoutubeUrl(lesson.getAttribute("data-video"));
                videoTitle.textContent = title;
                descriptionText.textContent = "You are currently watching: " + title;
            });
        });

        /* Fullscreen (native, with CSS fallback for iPhone) */
        function isFullscreen() {
            return document.fullscreenElement === videoWrapper ||
                   document.webkitFullscreenElement === videoWrapper ||
                   videoWrapper.classList.contains("pseudo-fs");
        }

        function updateButton() {
            fullscreenButton.innerHTML = isFullscreen() ? "&#10005;" : "&#9974;";
        }

        function setPseudo(on) {
            videoWrapper.classList.toggle("pseudo-fs", on);
            document.body.classList.toggle("no-scroll", on);
            updateButton();
        }

        async function enterFullscreen() {
            try {
                if (videoWrapper.requestFullscreen) {
                    await videoWrapper.requestFullscreen();
                } else if (videoWrapper.webkitRequestFullscreen) {
                    videoWrapper.webkitRequestFullscreen();
                } else {
                    setPseudo(true);
                }
            } catch (error) {
                setPseudo(true);
            }
        }

        async function exitFullscreen() {
            if (videoWrapper.classList.contains("pseudo-fs")) {
                setPseudo(false);
            } else if (document.exitFullscreen) {
                await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }

        fullscreenButton.addEventListener("click", function () {
            isFullscreen() ? exitFullscreen() : enterFullscreen();
        });

        document.addEventListener("fullscreenchange", updateButton);
        document.addEventListener("webkitfullscreenchange", updateButton);

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && videoWrapper.classList.contains("pseudo-fs")) setPseudo(false);
        });
    </script>

</body>

</html>
